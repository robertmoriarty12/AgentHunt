Descriptor:
  Name: AgentHunt.SentinelXdrLabQueries
  DisplayName: "AgentHunt - Sentinel XDR Lab Queries"
  Description: "A set of KQL skills for lab-focused hunting across process, file, registry, network, scheduled tasks, and AV test artifacts. Each skill includes analyst-friendly context to help Security Copilot reason about results in a test/XDR lab environment."
SkillGroups:
  - Format: KQL
    Skills:
      - Name: AgentHuntPowerShellStealth
        DisplayName: "AgentHunt - PowerShell Stealth & Encoded Commands"
        Description: |
          Purpose: Detect PowerShell invocations whose *own* command line contains stealth/evasion/automation flags.
          Why run this: Attackers and red teams frequently launch PowerShell with flags that reduce visibility or enable scripted payloads (examples: "-WindowStyle Hidden" to hide a window, "-NoProfile" to bypass user profiles, "-EncodedCommand" to hide payload text).
          When to run: Run anytime you suspect scripted execution, stealthy automation, or when you see unusual process trees referencing PowerShell.
          What to expect from the lab harness: Hidden PowerShell child and an encoded-command child created by the harness; you'll see the flags in ProcessCommandLine.
          False positives: Legitimate admin tooling, scheduled automation, and management scripts sometimes use -NoProfile or -EncodedCommand. Check parent process and account.
          Follow-ups:
            - Inspect InitiatingProcessFileName and InitiatingProcessCommandLine to see what launched PowerShell.
            - Gather process hashes and check signatures or threat intelligence.
            - If EncodedCommand is present, attempt to decode or collect the command for triage (export process memory or perform live capture).
        Settings:
          Target: Sentinel
          TenantId: "<YOUR_TENANT_ID>"
          SubscriptionId: "<YOUR_SUBSCRIPTION_ID>"
          ResourceGroupName: "<YOUR_RESOURCE_GROUP_NAME>"
          WorkspaceName: "<YOUR_WORKSPACE_NAME>"
        Template: |-
          // Query: PowerShell processes with stealth/automation flags
          let timeframe = 4h;
          DeviceProcessEvents
          | where Timestamp >= ago(timeframe)
          | where FileName in~ ("powershell.exe","pwsh.exe")
          | where ProcessCommandLine has_any ("-WindowStyle Hidden","-NoProfile","-EncodedCommand","-e ","-nop")
          | project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, AccountName, InitiatingProcessFileHash
          | extend timestamp = Timestamp, AccountCustomEntity = tostring(coalesce(InitiatingProcessAccountName, AccountName, "")), HostCustomEntity = DeviceName
          | order by Timestamp desc
      - Name: AgentHuntProcessInventory
        DisplayName: "AgentHunt - Process Inventory (Top Runners)"
        Description: |
          Purpose: Produce an aggregated inventory of executables started in the timeframe (counts, first/last seen, sample command lines and initiators).
          Why run this: Quickly reveals which binaries dominated activity in the window so you can spot unusual or new files without hard-coding names.
          When to run: Good as a first-step after any simulation or suspected compromise to enumerate the primary executables that generated telemetry.
          What to expect from the lab harness: notepad/mspaint/calc and powershell entries produced by the harness will appear near the top.
          False positives: Installers, scheduled jobs, and updaters often appear with high counts — use initiators and command-lines to filter.
          Follow-ups:
            - Investigate low-frequency or unfamiliar binaries: file hash, signature, publisher, and parent-child chain.
            - Cross-reference with a 30-day baseline to highlight “rare” binaries.
        Settings:
          Target: Sentinel
          TenantId: "<YOUR_TENANT_ID>"
          SubscriptionId: "<YOUR_SUBSCRIPTION_ID>"
          ResourceGroupName: "<YOUR_RESOURCE_GROUP_NAME>"
          WorkspaceName: "<YOUR_WORKSPACE_NAME>"
        Template: |-
          // Query: Aggregated inventory of executables started in the timeframe
          let timeframe = 2h;
          DeviceProcessEvents
          | where Timestamp >= ago(timeframe)
          | summarize
              Count = count(),
              FirstSeen = min(Timestamp),
              LastSeen = max(Timestamp),
              SampleCmdLines = make_set(tostring(ProcessCommandLine), 5),
              SampleInitiators = make_set(tostring(InitiatingProcessFileName), 5)
            by FileName
          | order by Count desc
          | extend timestamp = FirstSeen, AccountCustomEntity = "", HostCustomEntity = ""
      - Name: AgentHuntTempStaging
        DisplayName: "AgentHunt - Temp File Staging & Opens"
        Description: |
          Purpose: Find files written into user temporary folders and the processes that opened them.
          Why run this: Malware and scripts commonly stage payloads or exfil artifacts in temp directories. Correlating writes with process opens exposes staging and immediate usage.
          When to run: Run after detecting new files, process execs, or to validate file-staging behavior in a lab run.
          What to expect from the lab harness: GUID-named temp file(s) and notepad opening those files; you will see write events and notepad open events.
          False positives: Installers and benign apps frequently use temp; verify initiator and file contents/hashes to reduce noise.
          Follow-ups:
            - Pull file hashes and submit to TI / file reputation.
            - If suspicious, request file retrieval or endpoint forensic collection.
            - Correlate with DeviceProcessEvents to find who wrote and who opened the file.
        Settings:
          Target: Sentinel
          TenantId: "<YOUR_TENANT_ID>"
          SubscriptionId: "<YOUR_SUBSCRIPTION_ID>"
          ResourceGroupName: "<YOUR_RESOURCE_GROUP_NAME>"
          WorkspaceName: "<YOUR_WORKSPACE_NAME>"
        Template: |-
          // Query: File writes into user temp and processes that opened them
          let timeframe = 2h;
          DeviceFileEvents
          | where Timestamp >= ago(timeframe)
          | where FolderPath has @"\AppData\Local\Temp" or FolderPath has @"\Temp\"
          | project Timestamp, DeviceName, FileName, FolderPath, ActionType, InitiatingProcessFileName, InitiatingProcessCommandLine
          | extend timestamp = Timestamp, AccountCustomEntity = tostring(coalesce(InitiatingProcessAccountName, AccountName, "")), HostCustomEntity = DeviceName
          | order by Timestamp desc
      - Name: AgentHuntRunKeyAutorun
        DisplayName: "AgentHunt - Run/RunOnce Autorun Modifications"
        Description: |
          Purpose: Detect creation or modification of Run/RunOnce autorun registry values – a common persistence mechanism.
          Why run this: Adversaries create entries here to relaunch components at logon; benign installers also write here so context matters.
          When to run: Run as part of persistence hunts or after seeing process/file events suggesting re-execution (e.g., staged drop + autorun registration).
          What to expect from the lab harness: an entry named "LabTelemetry" pointing to notepad.exe in the Run key under the current user.
          False positives: legitimate startup entries from installers; verify the value path and initiating process.
          Follow-ups:
            - Inspect RegistryValueData for odd paths or encoded commands.
            - Query DeviceProcessEvents at the same timestamp to identify the initiator and account.
            - If malicious, remove the entry and enumerate other persistence mechanisms (tasks, services, startup folder).
        Settings:
          Target: Sentinel
          TenantId: "<YOUR_TENANT_ID>"
          SubscriptionId: "<YOUR_SUBSCRIPTION_ID>"
          ResourceGroupName: "<YOUR_RESOURCE_GROUP_NAME>"
          WorkspaceName: "<YOUR_WORKSPACE_NAME>"
        Template: |-
          // Query: Detect Run/RunOnce registry value sets (Run key persistence)
          let timeframe = 2h;
          DeviceRegistryEvents
          | where Timestamp >= ago(timeframe)
          | where RegistryKey has @"\Software\Microsoft\Windows\CurrentVersion\Run"
             or RegistryKey has @"\Software\Microsoft\Windows\CurrentVersion\RunOnce"
          | project Timestamp, DeviceName, RegistryKey, RegistryValueName, RegistryValueData, InitiatingProcessFileName, InitiatingProcessCommandLine, AccountName
          | extend timestamp = Timestamp, AccountCustomEntity = tostring(coalesce(AccountName, InitiatingProcessAccountName, "")), HostCustomEntity = DeviceName
          | order by Timestamp desc
      - Name: AgentHuntRegistryLabWrites
        DisplayName: "AgentHunt - LabHarness Registry Writes"
        Description: |
          Purpose: Locate arbitrary registry values created under HKCU\Software\LabHarness or similar lab-specific keys.
          Why run this: Lab scripts create demonstration keys/values; surfacing these validates registry telemetry and ties lab actions to hunts.
          When to run: Useful immediately after lab runs to confirm registry telemetry collection and to map lab noise to registry events.
          What to expect from the lab harness: a write to 'HKCU\Software\LabHarness\Toggle' containing a GUID.
          False positives: None in a lab context — in production, similar keys may be used by legitimate apps.
          Follow-ups:
            - Confirm key/value strings and value data match expected lab noise.
            - If registry events are absent, check EDR registry collection settings.
            - Correlate with process events to find the initiator.
        Settings:
          Target: Sentinel
          TenantId: "<YOUR_TENANT_ID>"
          SubscriptionId: "<YOUR_SUBSCRIPTION_ID>"
          ResourceGroupName: "<YOUR_RESOURCE_GROUP_NAME>"
          WorkspaceName: "<YOUR_WORKSPACE_NAME>"
        Template: |-
          // Query: Show registry values set under LabHarness keys or with LabTelemetry references
          let timeframe = 4h;
          DeviceRegistryEvents
          | where Timestamp >= ago(timeframe)
          | where RegistryKey has "LabHarness" or RegistryValueName has "LabTelemetry" or RegistryValueData has "notepad.exe"
          | project Timestamp, DeviceName, ActionType, AccountName, RegistryKey, RegistryValueName, RegistryValueData, InitiatingProcessFileName, InitiatingProcessCommandLine
          | extend timestamp = Timestamp, AccountCustomEntity = tostring(coalesce(AccountName, InitiatingProcessAccountName, "")), HostCustomEntity = DeviceName
          | order by Timestamp desc
      - Name: AgentHuntNetworkRecon
        DisplayName: "AgentHunt - DNS & HTTP Recon Probes"
        Description: |
          Purpose: Find DNS and HTTP probes to external domains that indicate scripted reconnaissance or automated checks.
          Why run this: Repeated DNS + HTTP to many distinct hosts (especially from non-browser parents) is a signature of discovery or automated recon. Cross-check domains against TI to prioritize.
          When to run: After suspicious process behavior or routinely to surface devices performing unusual outbound recon.
          What to expect from the lab harness: DNS & HTTP entries for example.com, badssl.com, iana.org, malware-traffic-analysis.net; msftconnecttest.com may fail to resolve.
          False positives: Normal browsing or update checks — differentiate by initiator (browser vs hidden process) and frequency.
          Follow-ups:
            - Inspect initiating process & command line; escalate when non-browser or hidden processes are responsible.
            - Compare destinations against ThreatIntelligenceIndicator.
            - Aggregate distinct-host counts in short bins (recon fingerprinting).
        Settings:
          Target: Sentinel
          TenantId: "<YOUR_TENANT_ID>"
          SubscriptionId: "<YOUR_SUBSCRIPTION_ID>"
          ResourceGroupName: "<YOUR_RESOURCE_GROUP_NAME>"
          WorkspaceName: "<YOUR_WORKSPACE_NAME>"
        Template: |-
          // Query: DNS + HTTP probes to lab/demo domains
          let timeframe = 2h;
          DeviceNetworkEvents
          | where Timestamp >= ago(timeframe)
          | where ActionType in ("DnsQuery","HttpConnectionInspected","ConnectionAttempted","ConnectionSuccess")
          | where RemoteUrl has_any ("example.com","badssl.com","iana.org","malware-traffic-analysis.net","msftconnecttest.com")
          | project Timestamp, DeviceName, InitiatingProcessFileName, InitiatingProcessAccountName, RemoteUrl, RemoteIP, RemotePort, ActionType
          | extend timestamp = Timestamp, AccountCustomEntity = tostring(coalesce(InitiatingProcessAccountName, "")), HostCustomEntity = DeviceName
          | order by Timestamp desc
      - Name: AgentHuntTestNetProbes
        DisplayName: "AgentHunt - RFC5737 TEST-NET Probes"
        Description: |
          Purpose: Spot outbound TCP/connection probes to RFC5737 TEST-NET ranges (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24).
          Why run this: These documentation/test IPs are rarely contacted in production and often indicate scripted lab probes, sandbox checks, or misconfigured tooling using example addresses.
          When to run: When hunting for scripted scanning or to identify lab hosts running synthetic recon tests.
          What to expect from the lab harness: quick connect attempts to 192.0.2.1, 198.51.100.1, 203.0.113.1 that typically fail to connect but still generate network telemetry.
          False positives: Extremely unlikely in normal enterprise traffic; investigate if seen outside lab scope.
          Follow-ups:
            - Correlate with initiating process to identify the script/tool.
            - Capture process timeline and network session for deeper triage.
            - Consider blocking/alerting on these ranges in production detection rules.
        Settings:
          Target: Sentinel
          TenantId: "<YOUR_TENANT_ID>"
          SubscriptionId: "<YOUR_SUBSCRIPTION_ID>"
          ResourceGroupName: "<YOUR_RESOURCE_GROUP_NAME>"
          WorkspaceName: "<YOUR_WORKSPACE_NAME>"
        Template: |-
          // Query: Probes to RFC5737 TEST-NET ranges (lab/test IPs)
          let timeframe = 2h;
          DeviceNetworkEvents
          | where Timestamp >= ago(timeframe)
          | where isnotempty(RemoteIP)
          | where ipv4_is_in_range(RemoteIP, "192.0.2.0/24")
             or ipv4_is_in_range(RemoteIP, "198.51.100.0/24")
             or ipv4_is_in_range(RemoteIP, "203.0.113.0/24")
          | project Timestamp, DeviceName, InitiatingProcessFileName, InitiatingProcessAccountName, RemoteIP, RemotePort, ActionType
          | extend timestamp = Timestamp, AccountCustomEntity = tostring(coalesce(InitiatingProcessAccountName, "")), HostCustomEntity = DeviceName
          | order by Timestamp desc
      - Name: AgentHuntEicarLifecycle
        DisplayName: "AgentHunt - EICAR File Write & AV Detection Lifecycle"
        Description: |
          Purpose: Show file writes and process requests around EICAR test artifacts to validate AV/EDR detection lifecycle (create -> detect -> quarantine/upload).
          Why run this: In lab testing, EICAR validates detection. This query pulls file creation events and associated process attempts and returns ReportId/Alert evidence where available.
          When to run: After a lab harness that writes/executes EICAR or other AV tests. Keep EICAR queries confined to lab contexts.
          What to expect from the lab harness: creation of C:\Temp\EICARTest\eicar.com and immediate Defender detection/quarantine events (DeviceFileEvents and DeviceEvents/alerts).
          False positives: None for EICAR itself; ensure EICAR queries are only run in isolated labs and not across production data.
          Follow-ups:
            - Cross-reference with DeviceEvents/Alerts or SecurityAlert to see quarantine/upload evidence (ReportId/AlertId).
            - If AV intervened before execution, check scheduled-task registration events to verify persistence attempts.
            - Use results to validate EDR/AV config and telemetry completeness.
        Settings:
          Target: Sentinel
          TenantId: "<YOUR_TENANT_ID>"
          SubscriptionId: "<YOUR_SUBSCRIPTION_ID>"
          ResourceGroupName: "<YOUR_RESOURCE_GROUP_NAME>"
          WorkspaceName: "<YOUR_WORKSPACE_NAME>"
        Template: |-
          // Query: File writes & process requests related to EICAR artifacts
          let timeframe = 2h;
          DeviceFileEvents
          | where Timestamp >= ago(timeframe)
          | where FileName has "eicar" or FolderPath has "EICARTest" or (FileName has ".com" and FileName has "eicar")
          | project Timestamp, DeviceName, FileName, FolderPath, ActionType, InitiatingProcessFileName, ReportId
          | extend timestamp = Timestamp, AccountCustomEntity = tostring(coalesce(InitiatingProcessAccountName, AccountName, "")), HostCustomEntity = DeviceName
          | order by Timestamp desc
